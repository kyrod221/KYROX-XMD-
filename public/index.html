<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYROX Bot - Pairing Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 400;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .youtube {
            background: #FF0000;
        }

        .telegram {
            background: #0088cc;
        }

        .whatsapp {
            background: #25D366;
        }

        .github {
            background: #333;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 6px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #efefef;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: #f9f9f9;
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-box.empty {
            color: #999;
            font-size: 14px;
        }

        .result-box.code {
            background: #1a1a2e;
            color: #667eea;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            word-break: break-all;
            border-color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .alert.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #1565c0;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 13px;
        }

        .copy-feedback {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e7d32;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        .copy-feedback.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                width: 70px;
                height: 70px;
                font-size: 35px;
            }

            .social-links {
                gap: 12px;
            }

            .social-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖</div>
            <h1>KYROX Bot</h1>
            <p class="subtitle">Générez votre Pair Code WhatsApp</p>
        </div>

        <div class="social-links">
            <a href="#" class="social-btn youtube" title="YouTube">▶</a>
            <a href="#" class="social-btn telegram" title="Telegram">✈️</a>
            <a href="#" class="social-btn whatsapp" title="WhatsApp">💬</a>
            <a href="#" class="social-btn github" title="GitHub">◈</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pairing')">📱 Pair Code</button>
            <button class="tab-btn" onclick="switchTab('session')">🔑 Session ID</button>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Tab Pairing Code -->
        <div id="pairing" class="tab-content active">
            <div class="form-group">
                <label for="numberInput">Entrez votre numéro WhatsApp (code pays inclus)</label>
                <input 
                    type="tel" 
                    id="numberInput" 
                    placeholder="Ex: 33612345678"
                    autocomplete="tel"
                >
            </div>

            <button class="btn btn-primary" onclick="generateCode()">
                <span>📱</span>
                <span>Générer Pair Code</span>
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Génération en cours...</p>
            </div>

            <div class="result-box empty" id="codeResult">
                Votre code d'appairage s'affichera ici
            </div>

            <button class="btn btn-secondary" onclick="copyToClipboard('codeResult')" id="copyCodeBtn" style="display: none;">
                <span>📋</span>
                <span>Copier le code</span>
            </button>
        </div>

        <!-- Tab Session ID -->
        <div id="session" class="tab-content">
            <div class="form-group">
                <label for="sessionInput">Entrez votre numéro WhatsApp</label>
                <input 
                    type="tel" 
                    id="sessionNumberInput" 
                    placeholder="Ex: 33612345678"
                    autocomplete="tel"
                >
            </div>

            <button class="btn btn-primary" onclick="generateSession()">
                <span>🔑</span>
                <span>Générer Session ID</span>
            </button>

            <div class="loading" id="loadingSession">
                <div class="spinner"></div>
                <p>Génération en cours...</p>
            </div>

            <div class="result-box empty" id="sessionResult">
                Votre Session ID s'affichera ici
            </div>

            <button class="btn btn-secondary" onclick="copyToClipboard('sessionResult')" id="copySessionBtn" style="display: none;">
                <span>📋</span>
                <span>Copier le Session ID</span>
            </button>
        </div>

        <div class="footer">
            © 2026 KYROX Bot | Pairing Code Generator
        </div>
    </div>

    <div class="copy-feedback" id="copyFeedback">✓ Copié dans le presse-papiers!</div>

    <script>
        const API_BASE_URL = window.location.origin;

        function switchTab(tabName) {
            // Masquer tous les onglets
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Afficher l'onglet sélectionné
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            if (cleaned.length < 10) {
                showAlert('❌ Numéro invalide! Utilisez le format international (ex: 33612345678)', 'error');
                return null;
            }
            return cleaned;
        }

        async function generateCode() {
            const input = document.getElementById('numberInput');
            const number = validatePhoneNumber(input.value);
            
            if (!number) return;

            const btn = event.target.closest('.btn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('codeResult');
            const copyBtn = document.getElementById('copyCodeBtn');

            btn.disabled = true;
            loading.style.display = 'block';
            result.className = 'result-box empty';
            result.textContent = 'Génération en cours...';
            copyBtn.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/code?number=${number}`);
                const data = await response.json();

                if (data.status && data.code) {
                    result.className = 'result-box code';
                    result.textContent = data.code;
                    copyBtn.style.display = 'flex';
                    showAlert('✅ Pair Code généré avec succès!', 'success');
                } else {
                    result.className = 'result-box empty';
                    result.textContent = data.message || 'Erreur lors de la génération';
                    showAlert(data.message || 'Erreur serveur', 'error');
                }
            } catch (error) {
                result.className = 'result-box empty';
                result.textContent = 'Erreur de connexion';
                showAlert('❌ Erreur de connexion: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        async function generateSession() {
            const input = document.getElementById('sessionNumberInput');
            const number = validatePhoneNumber(input.value);
            
            if (!number) return;

            const btn = event.target.closest('.btn');
            const loading = document.getElementById('loadingSession');
            const result = document.getElementById('sessionResult');
            const copyBtn = document.getElementById('copySessionBtn');

            btn.disabled = true;
            loading.style.display = 'block';
            result.className = 'result-box empty';
            result.textContent = 'Génération en cours...';
            copyBtn.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/code?number=${number}`);
                const data = await response.json();

                if (data.status && data.sessionId) {
                    result.className = 'result-box code';
                    result.textContent = data.sessionId;
                    result.style.fontSize = '12px';
                    result.style.letterSpacing = '0.5px';
                    copyBtn.style.display = 'flex';
                    showAlert('✅ Session ID généré et envoyé sur WhatsApp!', 'success');
                } else {
                    result.className = 'result-box empty';
                    result.textContent = data.message || 'Erreur lors de la génération';
                    showAlert(data.message || 'Erreur serveur', 'error');
                }
            } catch (error) {
                result.className = 'result-box empty';
                result.textContent = 'Erreur de connexion';
                showAlert('❌ Erreur de connexion: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopyFeedback();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopyFeedback();
        }

        function showCopyFeedback() {
            const feedback = document.getElementById('copyFeedback');
            feedback.classList.add('show');
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }

        // Permettre la génération avec Entrée
        document.getElementById('numberInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateCode();
        });

        document.getElementById('sessionNumberInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateSession();
        });
    </script>
</body>
</html>
